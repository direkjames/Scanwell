name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # GitHub's runners already include the Android SDK. local.properties is not committed, so
      # point Gradle at that SDK.
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      - name: Release build (checks the code shrinker keeps PDFBox working)
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: scanwell-debug-apk
          path: app/build/outputs/apk/debug/*.apk
